# El plugin de Flow Launcher de PinDesk y lo poco que necesita de la app.
[workspace]
resolver = "3"
members = [
    "pindesk-lanzador",
    "crates/pindesk-lecciones",
    "crates/pindesk-frase",
    "crates/pindesk-calculadora",
    "crates/promax-core",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Max Anthony Mamani Maquera"]
repository = "https://github.com/1xmanMAX/PIXPIN_PRO_PLUGIN_FLOWLAUNCHER"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
